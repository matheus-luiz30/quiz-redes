{% extends "base.html" %}

{% block titulo %}Pergunta - Quiz Redes{% endblock %}

{% block conteudo %}
    <p class="placar">Pontuação: {{ pontuacao }} | Acertos: {{ acertos }}</p>
    <h1>{{ pergunta.enunciado }}</h1>
    <form action="/responder" method="POST" class="formulario">
        <input type="hidden" name="pergunta_id" value="{{ pergunta.id }}">
        {% for letra, alternativa in alternativas_com_letra %}
            <label class="alternativa">
                <input type="radio" name="resposta" value="{{ letra }}" required>
                <span>{{ letra }}) {{ alternativa }}</span>
            </label>
        {% endfor %}
        <button type="submit">Responder</button>
    </form>
{% endblock %}
