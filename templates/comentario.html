<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Quiz Redes</title>
</head>
<body>
    {% if acertou %}
        <h1>Acertou!</h1>
    {% else %}
        <h1>Errou!</h1>
    {% endif %}
    <p>{{ comentario }}</p>
    <p>Pontuação: {{ pontuacao }} | Acertos: {{ acertos }}</p>
    <a href="/pergunta">Próxima pergunta</a>
</body>
</html>
