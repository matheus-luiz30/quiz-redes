{% extends "base.html" %}

{% block titulo %}Quiz Redes{% endblock %}

{% block conteudo %}
    <h1>Bem-vindo ao Quiz de Redes!</h1>
    {% if erro %}
        <p class="erro">{{ erro }}</p>
    {% endif %}
    <form action="/comecar" method="POST" class="formulario">
        <label for="nome">Digite seu nome:</label>
        <input type="text" id="nome" name="nome" required>
        <button type="submit">Começar</button>
    </form>
    <p><a href="/ranking">Ver ranking</a></p>
{% endblock %}
